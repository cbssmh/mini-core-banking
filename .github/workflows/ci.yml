name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: minibank
          POSTGRES_USER: minibank
          POSTGRES_PASSWORD: minibank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minibank -d minibank"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/minibank
      DB_USERNAME: minibank
      DB_PASSWORD: minibank
      DB_DRIVER: org.postgresql.Driver
      JPA_DDL_AUTO: none
      FLYWAY_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Start application for Flyway migration
        run: |
          ./gradlew bootRun > bootrun.log 2>&1 &
          echo $! > bootrun.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/accounts > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat bootrun.log
          exit 1

      - name: Stop application after migration
        if: always()
        run: |
          if [ -f bootrun.pid ]; then
            kill "$(cat bootrun.pid)" || true
          fi

      - name: Run Testcontainers tests
        run: ./gradlew clean test

      - name: Build
        run: ./gradlew build
