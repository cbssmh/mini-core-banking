services:
  postgres:
    image: postgres:17
    container_name: mini-core-banking-v2-postgres
    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: minibank
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mini-core-banking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibank -d minibank"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    image: eclipse-temurin:21-jre
    container_name: mini-core-banking-v2-app
    working_dir: /workspace
    command: ["java", "-jar", "build/libs/mini-core-banking-0.0.1-SNAPSHOT.jar"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/minibank
      DB_USERNAME: minibank
      DB_PASSWORD: minibank
      DB_DRIVER: org.postgresql.Driver
      JPA_DDL_AUTO: none
      FLYWAY_ENABLED: "true"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace:ro
    networks:
      - mini-core-banking
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; cat <&3 | grep -q \"\\\"status\\\":\\\"UP\\\"\"'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: mini-core-banking-v2-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - mini-core-banking
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mini-core-banking-v2-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - mini-core-banking
    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres-data:
  grafana-data:

networks:
  mini-core-banking:
    driver: bridge
